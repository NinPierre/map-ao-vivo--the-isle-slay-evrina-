<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Isle - Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>

    <main class="shell">
      <section class="hero glass">
        <div>
          
          <h1>Apex Horizon BR</h1>
          <p class="lede">Ao vivo</p>
        </div>

        <div class="hero-stats">
          <article class="stat-card">
            <span>Estado</span>
            <strong id="statusText">Conectando</strong>
          </article>
          <article class="stat-card">
            <span>Jogadores</span>
            <strong id="playerCount">0</strong>
          </article>
          <article class="stat-card">
            <span>Atualizado</span>
            <strong id="updatedAt">--:--:--</strong>
          </article>
        </div>
      </section>

      <section class="workspace">
        <div class="map-panel glass">
          <div class="panel-head">
            

            <div class="panel-actions">
              <label class="mini-field">
                <span>Filtro</span>
                <input id="searchInput" type="search" placeholder="Nome ou ID" />
              </label>
              <label class="mini-field">
                <span>Coordenadas</span>
                <input id="manualInput" type="text" placeholder="X, Y, Z" />
              </label>
              <button id="applyButton" class="button button-primary">Ir</button>
            </div>
          </div>

          <div class="map-stage">
            <div class="map-frame" id="mapFrame">
              <img
                class="map-image"
                src="/gateway-map.webp"
                alt="Mapa real de The Isle Evrima, Gateway"
                draggable="false"
              />

              <svg
                id="mapSvg"
                class="map-overlay"
                viewBox="0 0 1000 1003"
                preserveAspectRatio="none"
                aria-label="Mapa Gateway"
              >
                <g id="markerLayer"></g>
                <g id="labelLayer"></g>
                <g id="poiLayer"></g>
              </svg>
            </div>

            <div class="map-legend">
              <span><i class="dot dot-red"></i> Jogador</span>
              <span><i class="dot dot-amber"></i> Foco</span>
            </div>
          </div>
        </div>

        <aside class="side-column">
          <section class="glass side-card">
            <div class="panel-head compact">
              <div>
                <p class="panel-kicker">Lista</p>
                <h2>Jogadores</h2>
              </div>
              <span id="visibleCount" class="pill">0 visiveis</span>
            </div>
            <div id="playerList" class="player-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <template id="playerTemplate">
      <button class="player-card" type="button">
        <strong class="player-name"></strong>
      </button>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
